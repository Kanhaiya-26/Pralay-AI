# GitHub Pages: deploys the STATIC SHOWCASE only — a read-only snapshot of SYNTHETIC demo data.
# GitHub Pages cannot run the FastAPI backend, workers, SQLite or Ollama; no backend URL is embedded.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Refresh the snapshot locally first:  cd backend; .venv\Scripts\python.exe scripts\export_showcase.py
name: Deploy static showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build showcase
        working-directory: frontend
        run: |
          test -f showcase-public/snapshot/summary.json || { echo "Snapshot missing: run backend/scripts/export_showcase.py locally and commit frontend/showcase-public"; exit 1; }
          npm ci --no-audit --no-fund
          npm run build:showcase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
