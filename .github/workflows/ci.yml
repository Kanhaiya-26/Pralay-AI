# CI: install, build the UI, start the backend OFFLINE (no external lookups, visual AI disabled) and run the smoke test.
# The full suites (live services, Edge browser, local Ollama) are run locally with backend/scripts/run_tests.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTERNAL_LOOKUPS: "false"
      VISION_PROVIDER: "none"
      PRALAY_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Build frontend (local app build + static showcase build)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:showcase

      - name: Python modules compile
        run: python -m compileall -q backend/app backend/scripts

      - name: Start backend (offline) and run smoke test
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../server.log 2>&1 &
          python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Server log
        if: always()
        run: cat server.log || true
